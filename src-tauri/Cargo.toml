[package]
name = "makepresent"
version = "0.1.0"
description = "MakePresent - live presentation software for churches"
authors = ["DwellPraise Ministries / MakeSoftware"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "makepresent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# Runtime loading of the NDI SDK (Processing.NDI.Lib) so the app builds and
# runs cleanly WITHOUT the NDI SDK installed at compile time. The NDI SDK itself
# (Vizrt/NewTek) is royalty-free but must be downloaded separately; it is loaded
# dynamically at runtime, never linked. See broadcast.rs and README.
libloading = "0.8"

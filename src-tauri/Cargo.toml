[package]
name = "makepresent"
version = "0.1.0"
description = "MakePresent - live presentation software for churches"
authors = ["DwellPraise Ministries / MakeSoftware"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "makepresent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# Runtime loading of the NDI SDK (Processing.NDI.Lib) so the app builds and
# runs cleanly WITHOUT the NDI SDK installed at compile time. The NDI SDK itself
# (Vizrt/NewTek) is royalty-free but must be downloaded separately; it is loaded
# dynamically at runtime, never linked. See broadcast.rs and README.
libloading = "0.8"
midir = "0.11"
rosc = "0.11"
# Local-network Stage Display server. `axum` serves the stage web page and a
# WebSocket the phones/tablets subscribe to; `tokio` (already a transitive dep
# of Tauri) backs its async runtime and TCP listener.
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
futures-util = "0.3"
# Local IP enumeration for the Settings Network URL/QR display (no manual IP lookup).
get_if_addrs = "0.5"
# Scripture integrations: quick-xml parses the widely used OpenLP/Zefania XML
# Bible database format for importing custom Bibles; reqwest queries the
# bible-api.com REST service as a fallback source. `rustls-tls` keeps the build
# free of a system OpenSSL dependency.
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
